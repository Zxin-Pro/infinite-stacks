logoFile="icon.png"
description='''
无限堆叠 · Infinite Stacks
把原版 64 的堆叠上限抬到接近无限，工具/盔甲等耐久物品不受影响。
· /stack set|get|item|tag|reset|reload|diag —— 指令动态调整，服务端权威
· config/infinitestacks.json + infinitestacks.overrides.json 配置驱动
· 掉落物数量巨大时只渲染少量模型，其余用数字标签（K/M/B 缩写）代替
不添加任何新物品，纯堆叠逻辑修改 + 配置驱动 + 客户端渲染优化。
'''

